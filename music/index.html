<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
    <title>Defqon-1.com · Music</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #1f1b2e, #0a0a10 80%);
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 0, 50, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(0, 200, 255, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(180, 0, 255, 0.2) 0%, transparent 50%);
            animation: chromaticShift 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes chromaticShift {
            0% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.8; transform: scale(1.02); }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            transition: color 0.2s;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .back-btn:hover {
            color: #ff3060;
        }

        .back-btn i {
            margin-right: 0.5rem;
        }

        .page-title {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 20, 80, 0.8), 0 0 60px rgba(255, 20, 80, 0.5);
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2.5rem;
        }

        .music-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .music-item {
            background: rgba(10, 8, 15, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 40, 80, 0.15);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: left;
        }

        .music-item:hover {
            border-color: rgba(255, 40, 80, 0.4);
            background: rgba(15, 10, 20, 0.9);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .track-number {
            font-size: 1.5rem;
            font-weight: 900;
            color: rgba(255, 40, 80, 0.6);
            min-width: 30px;
            text-align: center;
        }

        .track-details {
            flex: 1;
            min-width: 0;
        }

        .track-name {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.03em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.2rem;
            letter-spacing: 0.05em;
        }

        .play-icon {
            font-size: 1.5rem;
            color: #ff3060;
            opacity: 0;
            transition: opacity 0.3s;
            flex-shrink: 0;
        }

        .music-item:hover .play-icon {
            opacity: 1;
        }

        .music-item.playing .play-icon {
            opacity: 1;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.95); }
        }

        .music-item.playing {
            border-color: rgba(255, 40, 80, 0.5);
            box-shadow: 0 0 20px rgba(255, 20, 60, 0.15);
        }

        .music-item.playing .track-number {
            color: #ff3060;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            .music-item {
                padding: 1rem;
                gap: 0.6rem;
            }
            .track-number {
                font-size: 1.2rem;
                min-width: 24px;
            }
            .track-name {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="bg-glow"></div>

    <div class="container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <h1 class="page-title">MUSIC</h1>
        <p class="page-subtitle">DEFQON-1.COM FESTIVAL SOUNDS</p>

        <div class="music-list" id="musicList">
            <!-- JavaScript 动态生成列表 -->
        </div>

        <footer>Copyright © Defqon-1.com</footer>
    </div>

    <script>
        (function() {
            const playlist = [
        { file: 'music/Breaking the Night.mp3', name: 'Breaking the Night', artist: 'Hardopera' },
        { file: 'music/City Lights.mp3', name: 'City Lights', artist: 'Hardopera' },
        { file: 'music/Digital Fantasy.mp3', name: 'Digital Fantasy', artist: 'Hardopera' },
        { file: 'music/Electric Aurora.mp3', name: 'Electric Aurora', artist: 'Hardopera' },
        { file: 'music/Electric Hearts.mp3	', name: 'Electric Hearts', artist: 'Hardopera' },
        { file: 'music/Electric Pulse.mp3', name: 'Electric Pulse', artist: 'Hardopera' }
            ];

            let currentAudio = null;
            let currentIndex = -1;

            const musicList = document.getElementById('musicList');

            function renderList() {
                musicList.innerHTML = '';
                playlist.forEach((track, index) => {
                    const item = document.createElement('div');
                    item.className = 'music-item';
                    item.innerHTML = `
                        <span class="track-number">${(index + 1).toString().padStart(2, '0')}</span>
                        <div class="track-details">
                            <div class="track-name">${track.name}</div>
                            <div class="track-artist">${track.artist}</div>
                        </div>
                        <i class="fas fa-play play-icon"></i>
                    `;
                    item.addEventListener('click', () => playTrack(index, item));
                    musicList.appendChild(item);
                });
            }

            function playTrack(index, itemElement) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }

                
                document.querySelectorAll('.music-item').forEach(el => el.classList.remove('playing'));

                if (currentIndex === index) {
                    
                    currentIndex = -1;
                    return;
                }

                
                currentIndex = index;
                currentAudio = new Audio(playlist[index].file);
                currentAudio.play().catch(() => {});
                itemElement.classList.add('playing');

                currentAudio.addEventListener('ended', () => {
                    itemElement.classList.remove('playing');
                    currentAudio = null;
                    currentIndex = -1;
                });
            }

            renderList();
        })();
    </script>
</body>
</html>
