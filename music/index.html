    <script type="module">
        import * as THREE from 'three';
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.2, 5.5);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const flowGroup = new THREE.Group();
        function createGlowTexture() {
            const c = document.createElement('canvas'); c.width = 32; c.height = 32;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.2, 'rgba(255,100,150,1)');
            grad.addColorStop(0.6, 'rgba(255,20,80,0.5)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(c);
        }
        function createParticles(count, c1, c2, r, h) {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                const a = Math.random() * Math.PI * 2, rr = r * (0.6 + Math.random() * 0.5), y = (Math.random() - 0.5) * h;
                pos[i] = Math.cos(a) * rr; pos[i+1] = y; pos[i+2] = Math.sin(a) * rr;
                const mc = new THREE.Color(c1).lerp(new THREE.Color(c2), Math.random());
                col[i] = mc.r; col[i+1] = mc.g; col[i+2] = mc.b;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.06, map: createGlowTexture(), blending: THREE.AdditiveBlending, depthWrite: false, vertexColors: true, transparent: true, opacity: 0.8 }));
        }
        flowGroup.add(createParticles(2000, '#ff2050', '#ff0060', 2.8, 4.5));
        flowGroup.add(createParticles(1500, '#00c8ff', '#0060ff', 3.2, 5));
        flowGroup.add(createParticles(1200, '#b000ff', '#ff00a0', 2.5, 4));
        scene.add(flowGroup);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.015, 32, 200), new THREE.MeshBasicMaterial({ color: 0xff2050, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.4 }));
        ring.rotation.x = Math.PI / 2.5; scene.add(ring);
        const ring2 = new THREE.Mesh(new THREE.TorusGeometry(3.0, 0.01, 16, 180), new THREE.MeshBasicMaterial({ color: 0x00c8ff, blending: THREE.AdditiveBlending, opacity: 0.3 }));
        ring2.rotation.z = Math.PI / 3; scene.add(ring2);
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending }));
        scene.add(core);
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(1000 * 3);
        for (let i = 0; i < starsPos.length; i += 3) {
            starsPos[i] = (Math.random() - 0.5) * 15; starsPos[i+1] = (Math.random() - 0.5) * 10; starsPos[i+2] = (Math.random() - 0.5) * 8 - 2;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.05, color: 0xffffff, blending: THREE.AdditiveBlending, opacity: 0.6 })));
        function animate() {
            const t = performance.now() * 0.001;
            flowGroup.rotation.y += 0.001; flowGroup.rotation.x = Math.sin(t * 0.3) * 0.06; flowGroup.rotation.z += 0.0005;
            ring.rotation.z += 0.002; ring.rotation.x = Math.PI/2.5 + Math.sin(t * 1.5) * 0.15; ring.material.opacity = 0.3 + Math.sin(t * 5) * 0.15;
            ring2.rotation.y += 0.003; ring2.rotation.x += 0.001;
            core.scale.setScalar(1 + Math.sin(t * 10) * 0.3);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>

    <script>
        (function() {
            const playlist = [
                { file: 'https://defqon-1.com/music/Electric Hearts.mp3', name: 'Electric Hearts', artist: 'Hardopera' },
                { file: 'https://defqon-1.com/music/City Lights.mp3', name: 'City Lights', artist: 'Hardopera' },
                { file: 'https://defqon-1.com/music/Digital Fantasy.mp3', name: 'Digital Fantasy', artist: 'Hardopera' },
                { file: 'https://defqon-1.com/music/Electric Aurora.mp3', name: 'Electric Aurora', artist: 'Hardopera' },
                { file: 'https://defqon-1.com/music/Breaking the Night.mp3', name: 'Breaking the Night', artist: 'Hardopera' },
                { file: 'https://defqon-1.com/music/Electric Pulse.mp3', name: 'Electric Pulse', artist: 'Hardopera' }
            ];

            let currentIndex = 0;
            let isPlaying = false;
            let isMuted = false;
            let volume = 0.7;
            let playMode = 'sequential';
            let shuffleQueue = [];
            const audio = new Audio();

            const trackNameEl = document.getElementById('trackName');
            const trackArtistEl = document.getElementById('trackArtist');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const loopBtn = document.getElementById('loopBtn');
            const muteBtn = document.getElementById('muteBtn');
            const progressBarWrap = document.getElementById('progressBarWrap');
            const progressFill = document.getElementById('progressFill');
            const progressScrubber = document.getElementById('progressScrubber');
            const currentTimeEl = document.getElementById('currentTime');
            const durationTimeEl = document.getElementById('durationTime');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeFill = document.getElementById('volumeFill');
            const volumeScrubber = document.getElementById('volumeScrubber');
            const playlistContainer = document.getElementById('playlistContainer');
            const modeBtns = document.querySelectorAll('.mode-btn');

            audio.volume = volume;

            function loadTrack(index) {
                currentIndex = index;
                audio.src = playlist[index].file;
                trackNameEl.textContent = playlist[index].name;
                trackArtistEl.textContent = playlist[index].artist;
                updatePlaylistUI();
            }

            function togglePlay() {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                } else {
                    audio.play().then(() => {
                        isPlaying = true;
                    }).catch(() => {
                        isPlaying = false;
                    });
                }
                updatePlayBtn();
            }

            function updatePlayBtn() {
                playBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            }

            function nextTrack() {
                if (playMode === 'repeat-one') {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                    return;
                }
                if (playMode === 'shuffle') {
                    if (shuffleQueue.length === 0) buildShuffleQueue();
                    if (shuffleQueue.length > 0) {
                        currentIndex = shuffleQueue.shift();
                    } else {
                        currentIndex = (currentIndex + 1) % playlist.length;
                    }
                } else {
                    currentIndex = (currentIndex + 1) % playlist.length;
                }
                loadTrack(currentIndex);
                if (!isPlaying) {
                    isPlaying = true;
                    updatePlayBtn();
                }
                audio.play().catch(() => {
                    isPlaying = false;
                    updatePlayBtn();
                });
            }

            function prevTrack() {
                if (playMode === 'shuffle') {
                    if (shuffleQueue.length === 0) buildShuffleQueue();
                    currentIndex = shuffleQueue.pop();
                    if (currentIndex === undefined) {
                        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                    }
                } else {
                    currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                }
                loadTrack(currentIndex);
                if (isPlaying) audio.play().catch(() => {});
            }

            function buildShuffleQueue() {
                shuffleQueue = [...Array(playlist.length).keys()].filter(i => i !== currentIndex);
                for (let i = shuffleQueue.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffleQueue[i], shuffleQueue[j]] = [shuffleQueue[j], shuffleQueue[i]];
                }
            }

            function setPlayMode(mode) {
                playMode = mode;
                modeBtns.forEach(b => b.classList.remove('active'));
                const activeBtn = document.querySelector(`.mode-btn[data-mode="${mode}"]`);
                if (activeBtn) activeBtn.classList.add('active');
                loopBtn.style.color = mode === 'repeat-one' ? '#ff3060' : 'rgba(255,255,255,0.45)';
                shuffleBtn.style.color = mode === 'shuffle' ? '#ff3060' : 'rgba(255,255,255,0.45)';
                if (mode === 'shuffle') buildShuffleQueue();
            }

            function formatTime(s) {
                if (isNaN(s) || !isFinite(s)) return '0:00';
                const m = Math.floor(s / 60); const sec = Math.floor(s % 60);
                return `${m}:${sec.toString().padStart(2, '0')}`;
            }

            function updateProgress() {
                if (audio.duration && isFinite(audio.duration)) {
                    const pct = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = pct + '%';
                    progressScrubber.style.left = pct + '%';
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    durationTimeEl.textContent = formatTime(audio.duration);
                }
            }

            function setProgress(e) {
                const rect = progressBarWrap.getBoundingClientRect();
                let pct = (e.clientX - rect.left) / rect.width;
                pct = Math.max(0, Math.min(1, pct));
                if (audio.duration && isFinite(audio.duration)) audio.currentTime = pct * audio.duration;
            }

            function updateVolumeUI() {
                const pct = volume * 100;
                volumeFill.style.width = pct + '%';
                volumeScrubber.style.left = pct + '%';
                muteBtn.innerHTML = isMuted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
                audio.volume = isMuted ? 0 : volume;
            }

            function setVolume(e) {
                const rect = volumeSlider.getBoundingClientRect();
                let pct = (e.clientX - rect.left) / rect.width;
                pct = Math.max(0, Math.min(1, pct));
                volume = pct;
                if (!isMuted) audio.volume = volume;
                updateVolumeUI();
            }

            function toggleMute() { isMuted = !isMuted; audio.volume = isMuted ? 0 : volume; updateVolumeUI(); }

            function buildPlaylistUI() {
                playlistContainer.innerHTML = '';
                playlist.forEach((t, i) => {
                    const div = document.createElement('div');
                    div.className = 'playlist-item';
                    div.innerHTML = `<span class="pl-num">${(i + 1).toString().padStart(2, '0')}</span><span class="pl-name">${t.name}</span><span style="font-size:0.65rem;color:rgba(255,255,255,0.3)">${t.artist}</span>`;
                    div.addEventListener('click', () => { loadTrack(i); if (!isPlaying) togglePlay(); else audio.play().catch(() => {}); });
                    playlistContainer.appendChild(div);
                });
                updatePlaylistUI();
            }

            function updatePlaylistUI() {
                const items = playlistContainer.querySelectorAll('.playlist-item');
                items.forEach((el, i) => el.classList.toggle('active', i === currentIndex));
            }

            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            muteBtn.addEventListener('click', toggleMute);

            shuffleBtn.addEventListener('click', () => setPlayMode(playMode === 'shuffle' ? 'sequential' : 'shuffle'));
            loopBtn.addEventListener('click', () => setPlayMode(playMode === 'repeat-one' ? 'sequential' : 'repeat-one'));

            modeBtns.forEach(b => {
                b.addEventListener('click', () => setPlayMode(b.dataset.mode));
            });

            let dragProgress = false;
            progressBarWrap.addEventListener('mousedown', (e) => { dragProgress = true; progressBarWrap.classList.add('dragging'); setProgress(e); });
            window.addEventListener('mousemove', (e) => { if (dragProgress) setProgress(e); });
            window.addEventListener('mouseup', () => { dragProgress = false; progressBarWrap.classList.remove('dragging'); });
            progressBarWrap.addEventListener('touchstart', (e) => { dragProgress = true; progressBarWrap.classList.add('dragging'); setProgress(e.touches[0]); });
            window.addEventListener('touchmove', (e) => { if (dragProgress) setProgress(e.touches[0]); });
            window.addEventListener('touchend', () => { dragProgress = false; progressBarWrap.classList.remove('dragging'); });

            let dragVolume = false;
            volumeSlider.addEventListener('mousedown', (e) => { dragVolume = true; volumeSlider.classList.add('dragging'); setVolume(e); });
            window.addEventListener('mousemove', (e) => { if (dragVolume) setVolume(e); });
            window.addEventListener('mouseup', () => { dragVolume = false; volumeSlider.classList.remove('dragging'); });
            volumeSlider.addEventListener('touchstart', (e) => { dragVolume = true; volumeSlider.classList.add('dragging'); setVolume(e.touches[0]); });
            window.addEventListener('touchmove', (e) => { if (dragVolume) setVolume(e.touches[0]); });
            window.addEventListener('touchend', () => { dragVolume = false; volumeSlider.classList.remove('dragging'); });

            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', () => { durationTimeEl.textContent = formatTime(audio.duration); });
            audio.addEventListener('ended', nextTrack);
            audio.addEventListener('play', () => { isPlaying = true; updatePlayBtn(); });
            audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtn(); });

            function init() {
                buildPlaylistUI();
                loadTrack(0);
                updateVolumeUI();
                updatePlayBtn();
                setPlayMode('sequential');
            }
            init();
        })();
    </script>
</body>
</html>
